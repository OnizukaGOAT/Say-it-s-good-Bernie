<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Say it's good, Bernie!</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141418;
    --card: #1a1a20;
    --border: #2a2a35;
    --accent: #f0c040;
    --accent2: #e05a30;
    --text: #f0ede8;
    --muted: #7a7880;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 15% 10%, #1e1a0e 0%, transparent 50%),
      radial-gradient(ellipse at 85% 85%, #120d0a 0%, transparent 50%);
    background-attachment: fixed;
  }

  header {
    padding: 1.4rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.5rem, 4.5vw, 2.4rem);
    color: var(--accent);
    letter-spacing: 0.05em;
    line-height: 1;
    cursor: pointer;
  }
  .logo span.o { color: var(--accent2); }
  .saving { font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--muted); margin-left: 12px; letter-spacing: 0; }

  .tabs { display: flex; gap: 8px; }
  .tab {
    padding: 0.45rem 1.1rem;
    border-radius: 2rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.2s;
  }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }

  main { max-width: 1000px; margin: 0 auto; padding: 2rem; }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 1rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2rem 1.4rem;
    margin-bottom: 1rem;
  }

  input[type="text"], input[type="url"], input[type="password"], input[type="search"], textarea, select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    padding: 0.6rem 1rem;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  textarea { resize: vertical; min-height: 220px; line-height: 1.6; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }

  label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; }

  .btn {
    padding: 0.6rem 1.3rem;
    border-radius: 8px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #ffd050; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--accent); border-color: var(--accent); }
  .btn-danger { background: transparent; color: var(--accent2); border: 1px solid var(--accent2); font-size: 0.8rem; padding: 0.3rem 0.7rem; }
  .btn-danger:hover { background: var(--accent2); color: #fff; }
  .btn-small { font-size: 0.8rem; padding: 0.3rem 0.7rem; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-style: italic; }

  .view { display: none; }
  .view.active { display: block; }

  /* ===== SEARCH + FILTERS ===== */
  .search-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 1.4rem;
  }
  .search-wrap { position: relative; flex: 1; min-width: 220px; }
  .search-wrap input { padding-left: 2.6rem; border-radius: 2rem; }
  .search-wrap .ico { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 0.4rem 0.95rem;
    border-radius: 2rem;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    transition: all 0.2s;
  }
  .chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

  /* ===== GRID ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 1.1rem;
  }
  @media(max-width:480px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; } main { padding: 1.2rem; } header { padding: 1rem 1.2rem; } }

  .tile {
    position: relative;
    aspect-ratio: 2/3;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    background: linear-gradient(160deg, #24202c, #15151a);
    border: 1px solid var(--border);
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .tile:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 10px 28px rgba(0,0,0,0.5); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
  .tile:hover img { transform: scale(1.05); }
  .tile-fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 44px; opacity: 0.25;
  }
  .tile-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.15) 45%, transparent 100%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0.9rem;
  }
  .tile-type {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(6px);
    color: var(--accent);
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 2rem;
    border: 1px solid rgba(240,192,64,0.35);
  }
  .tile-title {
    font-weight: 700; font-size: 0.98rem; line-height: 1.25;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ===== DETAIL ===== */
  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 2rem;
    padding: 0.5rem 1.1rem 0.5rem 0.9rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; font-weight: 500;
    cursor: pointer;
    margin-bottom: 1.4rem;
    transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateX(-3px); }
  .back-btn .arrow { font-size: 1.2rem; line-height: 1; }

  .detail {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 2rem;
    align-items: start;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media(max-width:720px) { .detail { grid-template-columns: 1fr; gap: 1.2rem; } .detail-cover { max-width: 280px; margin: 0 auto; width: 100%; } }

  .detail-cover {
    aspect-ratio: 2/3;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: linear-gradient(160deg, #24202c, #15151a);
    position: sticky; top: 1rem;
    box-shadow: 0 12px 36px rgba(0,0,0,0.5);
  }
  @media(max-width:720px) { .detail-cover { position: static; } }
  .detail-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .detail-badge {
    display: inline-block;
    background: rgba(240,192,64,0.12);
    color: var(--accent);
    border: 1px solid rgba(240,192,64,0.35);
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 11px; border-radius: 2rem; margin-bottom: 0.8rem;
  }
  .detail-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 6vw, 3.4rem);
    line-height: 1.05;
    letter-spacing: 0.03em;
    margin-bottom: 0.4rem;
  }
  .detail-date { color: var(--muted); font-size: 12px; margin-bottom: 1.4rem; }
  .detail-sep { height: 2px; width: 60px; background: var(--accent2); border-radius: 2px; margin-bottom: 1.4rem; }
  .detail-text { font-size: 1.02rem; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; color: #dcd8d2; }

  /* ===== ADMIN ===== */
  .login-box { max-width: 340px; margin: 4rem auto; text-align: center; }
  .lock-icon { font-size: 48px; margin-bottom: 12px; }
  .error-msg { color: var(--accent2); font-size: 13px; margin-bottom: 8px; }

  .form-grid { display: grid; grid-template-columns: 1fr 180px; gap: 12px; margin-bottom: 12px; }
  @media(max-width:600px) { .form-grid { grid-template-columns: 1fr; } }
  .form-row { margin-bottom: 12px; }
  .form-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .cover-preview {
    width: 70px; height: 105px; border-radius: 8px; object-fit: cover;
    border: 1px solid var(--border); background: var(--bg); display: none;
  }
  .url-row { display: flex; gap: 12px; align-items: flex-end; }
  .url-row > div { flex: 1; }

  .admin-item { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .admin-thumb { width: 54px; height: 80px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--border); }
  .admin-info { flex: 1; min-width: 140px; }
  .admin-info .title { font-weight: 500; margin-bottom: 3px; }
  .admin-info .sub { color: var(--muted); font-size: 12px; }
  .admin-btns { display: flex; gap: 8px; }

  .notice {
    background: rgba(224,90,48,0.1); border: 1px solid var(--accent2);
    color: var(--text); border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: 1rem; font-size: 14px; line-height: 1.5;
  }

  .toolbar { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .preview-box { display: none; margin-top: 12px; padding: 1.2rem; border: 1px dashed var(--border); border-radius: 12px; background: var(--surface); }
  .rv-img { white-space: normal; margin: 1.4rem 0; text-align: center; }
  .rv-img img { max-width: 100%; border-radius: 12px; border: 1px solid var(--border); display: inline-block; }
  .rv-img figcaption { color: var(--muted); font-size: 0.85rem; margin-top: 8px; font-style: italic; }
  .badge-draft { background: rgba(224,90,48,0.15); color: var(--accent2); border: 1px solid var(--accent2); font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 1px 8px; border-radius: 2rem; margin-left: 6px; vertical-align: middle; }
  .draft-note { font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--muted); letter-spacing: 0; margin-left: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">Say it's good, <span class="o">Bernie!</span><span class="saving" id="saving-indicator"></span></div>
  <div class="tabs">
    <button class="tab active" id="tab-home" onclick="goHome()">&#128214; Reseñas</button>
    <button class="tab" id="tab-admin" onclick="showAdmin()">&#127923; Admin</button>
  </div>
</header>

<main>

  <!-- HOME (usuario) -->
  <div id="view-home" class="view active">
    <div class="search-row">
      <div class="search-wrap">
        <span class="ico">&#128269;</span>
        <input type="search" id="search-input" placeholder="Buscar anime o personaje..." oninput="renderGrid()">
      </div>
      <div class="chips" id="chips">
        <button class="chip active" data-cat="all" onclick="setCat('all')">Todos</button>
        <button class="chip" data-cat="Anime" onclick="setCat('Anime')">Anime</button>
        <button class="chip" data-cat="Personaje" onclick="setCat('Personaje')">Personajes</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <!-- DETALLE (usuario) -->
  <div id="view-detail" class="view">
    <button class="back-btn" onclick="goHome()"><span class="arrow">&#8592;</span> Volver</button>
    <div id="detail-content"></div>
  </div>

  <!-- ADMIN LOGIN -->
  <div id="view-login" class="view">
    <div class="card login-box">
      <div class="lock-icon">&#128274;</div>
      <div class="section-title" style="margin-bottom:1rem">Acceso Admin</div>
      <input type="password" id="admin-pw-input" placeholder="Access Key de JSONBin" onkeydown="if(event.key==='Enter')tryLogin()" style="margin-bottom:10px">
      <p class="error-msg" id="login-error" style="display:none">Escribe tu clave</p>
      <button class="btn btn-primary" style="width:100%;padding:.7rem;margin-top:4px" onclick="tryLogin()">Entrar</button>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="view-admin" class="view">
    <div id="db-notice"></div>

    <div class="section-title" id="form-title">Nueva reseña</div>
    <div class="card">
      <div class="form-grid">
        <div>
          <label>Título</label>
          <input type="text" id="f-title" placeholder="Ej: Fullmetal Alchemist: Brotherhood">
        </div>
        <div>
          <label>Tipo</label>
          <select id="f-cat">
            <option value="Anime">Anime</option>
            <option value="Personaje">Personaje</option>
          </select>
        </div>
      </div>
      <div class="form-row url-row">
        <div>
          <label>URL de la imagen de portada</label>
          <input type="url" id="f-cover" placeholder="https://..." oninput="previewCover()">
        </div>
        <img class="cover-preview" id="cover-preview" alt="">
      </div>
      <div class="form-row">
        <label>Reseña / análisis</label>
        <div class="toolbar">
          <button class="btn btn-ghost btn-small" type="button" onclick="insertImage()">&#128444;&#65039; Insertar imagen</button>
          <button class="btn btn-ghost btn-small" type="button" onclick="togglePreview()">&#128065; Vista previa</button>
        </div>
        <textarea id="f-text" placeholder="Escribe aquí tu reseña... (los saltos de línea se respetan)"></textarea>
        <div id="preview-box" class="preview-box"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="f-save" onclick="publishReview()">Publicar</button>
        <button class="btn btn-ghost" id="f-draft" onclick="saveDraft()">Guardar borrador</button>
        <button class="btn btn-ghost" id="f-cancel" onclick="resetForm()" style="display:none">Cancelar</button>
      </div>
    </div>

    <div id="draft-list"></div>

    <div class="section-title" style="margin-top:2rem">Reseñas publicadas</div>
    <div id="admin-list"></div>
  </div>

</main>

<script>
// ============================================
//  CONFIGURACION
// ============================================
// Ya NO hay contraseña ni clave guardadas en el código.
// - Leer: el bin es público, no hace falta clave.
// - Escribir: la "contraseña" de admin es tu Access Key de JSONBin,
//   que escribes al entrar y solo vive en memoria mientras la pestaña esté abierta.
// Déjalo vacío para crear una base de datos NUEVA desde el panel Admin
// (así no pisas los datos de MusicJury). Luego pega aquí el ID que te muestre.
const JSONBIN_BIN_ID     = "6afa5210ffd5d16053c42fa9";

// ============================================
//  ESTADO
// ============================================
let reviews       = [];   // [{id, title, cat, cover, text, date}]
let binId         = JSONBIN_BIN_ID;
let adminUnlocked = false;
let adminKey      = "";
let currentCat    = "all";
let editingId     = null;
let editingKind   = null;   // null | 'draft' | 'review'
let drafts        = [];
let loaded        = false;

// ============================================
//  HELPERS
// ============================================
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function safeUrl(u) {
  u = (u || "").trim();
  return /^(https?:\/\/|[\w.\-\/]+\.(png|jpe?g|gif|webp|avif|svg)$)/i.test(u) ? u : "";
}
function norm(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
function setSaving(on) {
  document.getElementById("saving-indicator").textContent = on ? "guardando..." : "";
}
function fmtDate(ts) {
  try { return new Date(ts).toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" }); }
  catch(e) { return ""; }
}

// ============================================
//  JSONBIN API
// ============================================
async function loadData() {
  if (!binId) { loaded = true; renderAll(); return; }
  try {
    const res = await fetch("https://api.jsonbin.io/v3/b/" + binId + "/latest");
    if (!res.ok) throw new Error("Load failed");
    const json = await res.json();
    reviews = json.record.reviews || [];
  } catch(e) { console.error("loadData error:", e); }
  loaded = true;
  renderAll();
  route();
}

async function saveData() {
  if (!binId) { alert("Primero crea la base de datos (botón en el panel Admin)."); return false; }
  setSaving(true);
  try {
    const res = await fetch("https://api.jsonbin.io/v3/b/" + binId, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Access-Key": adminKey },
      body: JSON.stringify({ reviews: reviews })
    });
    if (res.status === 401 || res.status === 403) {
      adminUnlocked = false; adminKey = "";
      showView("login");
      throw new Error("la clave no es válida o no tiene permiso de escritura");
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    setSaving(false);
    return true;
  } catch(e) {
    console.error("saveData error:", e);
    alert("No se pudo guardar: " + e.message);
    setSaving(false);
    return false;
  }
}

async function createBin() {
  setSaving(true);
  try {
    const res = await fetch("https://api.jsonbin.io/v3/b", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Access-Key": adminKey,
        "X-Bin-Name": "bernie-reviews-data",
        "X-Bin-Private": "false"
      },
      body: JSON.stringify({ reviews: [] })
    });
    const json = await res.json();
    binId = json.metadata.id;
    reviews = [];
    renderAll();
    prompt("Base de datos creada. Copia este ID y pégalo en JSONBIN_BIN_ID dentro del código:", binId);
  } catch(e) { alert("Error creando la base de datos: " + e.message); }
  setSaving(false);
}

// ============================================
//  NAVEGACION (hash -> el botón atrás del móvil también funciona)
// ============================================
function showView(name) {
  ["home","detail","login","admin"].forEach(function(v) {
    document.getElementById("view-" + v).classList.toggle("active", v === name);
  });
  document.getElementById("tab-home").classList.toggle("active", name === "home" || name === "detail");
  document.getElementById("tab-admin").classList.toggle("active", name === "admin" || name === "login");
}

function goHome() {
  if (location.hash) { location.hash = ""; } else { route(); }
}
function openReview(id) { location.hash = "r/" + id; }

function route() {
  var h = location.hash.replace(/^#/, "");
  if (h.indexOf("r/") === 0) {
    var id = h.slice(2);
    var r = reviews.find(function(x){ return x.id === id; });
    if (r) { renderDetail(r); showView("detail"); window.scrollTo(0, 0); return; }
    if (!loaded) return;  // esperando datos
  }
  if (h === "admin") { showView(adminUnlocked ? "admin" : "login"); return; }
  showView("home");
}
window.addEventListener("hashchange", route);

function showAdmin() {
  location.hash = "admin";
  route();
}

function tryLogin() {
  var pw = document.getElementById("admin-pw-input").value.trim();
  if (pw) {
    adminKey = pw;
    adminUnlocked = true;
    document.getElementById("login-error").style.display = "none";
    document.getElementById("admin-pw-input").value = "";
    renderAdmin();
    showView("admin");
  } else {
    document.getElementById("login-error").style.display = "block";
  }
}

// ============================================
//  USUARIO: GRID + BUSCADOR
// ============================================
function setCat(cat) {
  currentCat = cat;
  document.querySelectorAll(".chip").forEach(function(c) {
    c.classList.toggle("active", c.dataset.cat === cat);
  });
  renderGrid();
}

function renderGrid() {
  var el = document.getElementById("grid");
  var q = norm(document.getElementById("search-input").value.trim());

  if (!loaded) { el.innerHTML = '<p class="empty" style="grid-column:1/-1">Cargando...</p>'; return; }
  if (!reviews.length) { el.innerHTML = '<p class="empty" style="grid-column:1/-1">Aún no hay reseñas publicadas.</p>'; return; }

  var list = reviews.filter(function(r) {
    if (currentCat !== "all" && r.cat !== currentCat) return false;
    if (q && norm(r.title).indexOf(q) === -1) return false;
    return true;
  });

  if (!list.length) { el.innerHTML = '<p class="empty" style="grid-column:1/-1">No se encontró nada con esa búsqueda.</p>'; return; }

  el.innerHTML = list.map(function(r) {
    var cover = safeUrl(r.cover);
    return '<div class="tile" onclick="openReview(\'' + esc(r.id) + '\')">' +
      '<div class="tile-fallback">&#127912;</div>' +
      (cover ? '<img src="' + esc(cover) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
      '<span class="tile-type">' + esc(r.cat) + '</span>' +
      '<div class="tile-overlay"><div class="tile-title">' + esc(r.title) + '</div></div>' +
    '</div>';
  }).join("");
}

// ============================================
//  USUARIO: DETALLE
// ============================================
function renderDetail(r) {
  var cover = safeUrl(r.cover);
  document.getElementById("detail-content").innerHTML =
    '<div class="detail">' +
      '<div class="detail-cover">' +
        (cover ? '<img src="' + esc(cover) + '" alt="' + esc(r.title) + '" onerror="this.style.display=\'none\'">' : '') +
      '</div>' +
      '<div>' +
        '<span class="detail-badge">' + esc(r.cat) + '</span>' +
        '<h1 class="detail-title">' + esc(r.title) + '</h1>' +
        '<div class="detail-date">' + esc(fmtDate(r.date)) + '</div>' +
        '<div class="detail-sep"></div>' +
        '<div class="detail-text">' + renderText(r.text) + '</div>' +
      '</div>' +
    '</div>';
}

// ============================================
//  ADMIN
// ============================================
function previewCover() {
  var url = safeUrl(document.getElementById("f-cover").value);
  var img = document.getElementById("cover-preview");
  if (url) { img.src = url; img.style.display = "block"; img.onerror = function(){ img.style.display = "none"; }; }
  else { img.style.display = "none"; }
}

// ---------- Texto de reseña con imágenes: [img: URL | pie opcional] ----------
function renderText(raw) {
  var html = esc(raw);
  return html.replace(/\n?\[img:\s*([^\s\]|]+)\s*(?:\|([^\]]*))?\]\n?/g, function(m, url, cap) {
    if (!safeUrl(url.replace(/&amp;/g, "&"))) return m;
    cap = (cap || "").trim();
    return '<figure class="rv-img"><img src="' + url + '" alt="' + cap + '" loading="lazy" onerror="this.style.display=\'none\'">' +
      (cap ? '<figcaption>' + cap + '</figcaption>' : '') + '</figure>';
  });
}

function insertImage() {
  var url = prompt("URL de la imagen (https://...) o ruta dentro del repo (img/foto.jpg):");
  if (!url) return;
  url = url.trim();
  if (!safeUrl(url) || /[\s\]|]/.test(url)) { alert("URL no válida (no puede tener espacios)."); return; }
  var cap = (prompt("Pie de foto (opcional):") || "").replace(/[\]\n]/g, " ").trim();
  var tag = "[img: " + url + (cap ? " | " + cap : "") + "]";
  var ta = document.getElementById("f-text");
  var s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
  var pre  = (s > 0 && v.charAt(s - 1) !== "\n") ? "\n" : "";
  var post = (e < v.length && v.charAt(e) !== "\n") ? "\n" : "";
  ta.value = v.slice(0, s) + pre + tag + post + v.slice(e);
  var pos = s + pre.length + tag.length + post.length;
  ta.focus();
  ta.setSelectionRange(pos, pos);
  if (document.getElementById("preview-box").style.display === "block") updatePreview();
}

function updatePreview() {
  var title = document.getElementById("f-title").value.trim();
  var text  = document.getElementById("f-text").value;
  document.getElementById("preview-box").innerHTML =
    '<div class="detail-badge">Vista previa</div>' +
    '<h1 class="detail-title" style="font-size:2rem">' + esc(title || "(Sin título)") + '</h1>' +
    '<div class="detail-sep"></div>' +
    '<div class="detail-text">' + renderText(text) + '</div>';
}

function togglePreview() {
  var box = document.getElementById("preview-box");
  if (box.style.display === "block") { box.style.display = "none"; return; }
  updatePreview();
  box.style.display = "block";
}

// ---------- Borradores (solo en este navegador) ----------
var DRAFTS_KEY = "bernie_drafts";
function loadDrafts() {
  try { drafts = JSON.parse(localStorage.getItem(DRAFTS_KEY) || "[]") || []; } catch(e) { drafts = []; }
}
function persistDrafts() {
  try { localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts)); return true; }
  catch(e) { alert("No se pudo guardar el borrador en este navegador."); return false; }
}
function flash(msg) {
  var el = document.getElementById("saving-indicator");
  el.textContent = msg;
  setTimeout(function(){ if (el.textContent === msg) el.textContent = ""; }, 2000);
}

// ---------- Formulario ----------
function syncFormButtons() {
  document.getElementById("f-draft").style.display  = (editingKind === "review") ? "none" : "";
  document.getElementById("f-cancel").style.display = editingKind ? "" : "none";
  document.getElementById("f-save").textContent = (editingKind === "review") ? "Guardar cambios" : "Publicar";
  document.getElementById("form-title").textContent =
    editingKind === "review" ? "Editando reseña" : (editingKind === "draft" ? "Continuando borrador" : "Nueva reseña");
}

function resetForm() {
  editingId = null;
  editingKind = null;
  document.getElementById("f-title").value = "";
  document.getElementById("f-cat").value = "Anime";
  document.getElementById("f-cover").value = "";
  document.getElementById("f-text").value = "";
  document.getElementById("preview-box").style.display = "none";
  syncFormButtons();
  previewCover();
}

function readForm(forPublish) {
  var title = document.getElementById("f-title").value.trim();
  var cat   = document.getElementById("f-cat").value;
  var cover = document.getElementById("f-cover").value.trim();
  var text  = document.getElementById("f-text").value.trim();
  if (forPublish) {
    if (!title) { alert("Escribe un título"); return null; }
    if (!text)  { alert("Escribe la reseña"); return null; }
  } else if (!title && !text) {
    alert("Escribe al menos un título o algo de texto."); return null;
  }
  if (cover && !safeUrl(cover)) { alert("La portada debe ser una URL https://... o una ruta como img/portada.jpg"); return null; }
  return { title: title, cat: cat, cover: cover, text: text };
}

async function publishReview() {
  var f = readForm(true);
  if (!f) return;
  var backup = JSON.stringify(reviews);
  var wasDraftId = (editingKind === "draft") ? editingId : null;

  if (editingKind === "review") {
    var r = reviews.find(function(x){ return x.id === editingId; });
    if (r) { r.title = f.title; r.cat = f.cat; r.cover = f.cover; r.text = f.text; }
  } else {
    reviews.unshift({ id: wasDraftId || Date.now().toString(), title: f.title, cat: f.cat, cover: f.cover, text: f.text, date: Date.now() });
  }
  renderAll();
  var ok = await saveData();
  if (ok) {
    if (wasDraftId) {
      drafts = drafts.filter(function(d){ return d.id !== wasDraftId; });
      persistDrafts();
    }
    resetForm();
    renderAdmin();
  } else {
    reviews = JSON.parse(backup);
    renderAll();
  }
}

function saveDraft() {
  var f = readForm(false);
  if (!f) return;
  if (editingKind === "draft") {
    var d = drafts.find(function(x){ return x.id === editingId; });
    if (d) { d.title = f.title; d.cat = f.cat; d.cover = f.cover; d.text = f.text; d.date = Date.now(); }
  } else {
    drafts.unshift({ id: Date.now().toString(), title: f.title, cat: f.cat, cover: f.cover, text: f.text, date: Date.now() });
  }
  if (!persistDrafts()) return;
  resetForm();
  renderAdmin();
  flash("borrador guardado");
}

function fillForm(item) {
  document.getElementById("f-title").value = item.title;
  document.getElementById("f-cat").value = item.cat;
  document.getElementById("f-cover").value = item.cover || "";
  document.getElementById("f-text").value = item.text;
  document.getElementById("preview-box").style.display = "none";
  syncFormButtons();
  previewCover();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function editReview(id) {
  var r = reviews.find(function(x){ return x.id === id; });
  if (!r) return;
  editingId = id; editingKind = "review";
  fillForm(r);
}

function editDraft(id) {
  var d = drafts.find(function(x){ return x.id === id; });
  if (!d) return;
  editingId = id; editingKind = "draft";
  fillForm(d);
}

async function deleteReview(id) {
  if (!confirm("¿Eliminar esta reseña?")) return;
  var backup = JSON.stringify(reviews);
  reviews = reviews.filter(function(r){ return r.id !== id; });
  if (editingId === id && editingKind === "review") resetForm();
  renderAll();
  var ok = await saveData();
  if (!ok) { reviews = JSON.parse(backup); renderAll(); }
}

function deleteDraft(id) {
  if (!confirm("¿Eliminar este borrador?")) return;
  drafts = drafts.filter(function(d){ return d.id !== id; });
  if (editingId === id && editingKind === "draft") resetForm();
  persistDrafts();
  renderAdmin();
}

function adminThumb(item) {
  var cover = safeUrl(item.cover);
  return cover
    ? '<img class="admin-thumb" src="' + esc(cover) + '" alt="" onerror="this.style.visibility=\'hidden\'">'
    : '<div class="admin-thumb"></div>';
}

function renderAdmin() {
  var notice = document.getElementById("db-notice");
  notice.innerHTML = binId ? "" :
    '<div class="notice">Todavía no hay base de datos configurada. ' +
    '<button class="btn btn-primary btn-small" style="margin-left:8px" onclick="createBin()">Crear base de datos</button></div>';

  // Borradores
  var dl = document.getElementById("draft-list");
  if (!drafts.length) { dl.innerHTML = ""; }
  else {
    dl.innerHTML =
      '<div class="section-title" style="margin-top:2rem">Borradores <span class="draft-note">solo visibles en este navegador</span></div>' +
      drafts.map(function(d) {
        return '<div class="card admin-item">' +
          adminThumb(d) +
          '<div class="admin-info">' +
            '<div class="title">' + esc(d.title || "(Sin título)") + ' <span class="badge-draft">Borrador</span></div>' +
            '<div class="sub">' + esc(d.cat) + ' · editado ' + esc(fmtDate(d.date)) + '</div>' +
          '</div>' +
          '<div class="admin-btns">' +
            '<button class="btn btn-primary btn-small" onclick="editDraft(\'' + esc(d.id) + '\')">Continuar</button>' +
            '<button class="btn btn-danger" onclick="deleteDraft(\'' + esc(d.id) + '\')">Eliminar</button>' +
          '</div>' +
        '</div>';
      }).join("");
  }

  // Publicadas
  var el = document.getElementById("admin-list");
  if (!reviews.length) { el.innerHTML = '<p class="empty">Aún no hay reseñas.</p>'; return; }
  el.innerHTML = reviews.map(function(r) {
    return '<div class="card admin-item">' +
      adminThumb(r) +
      '<div class="admin-info">' +
        '<div class="title">' + esc(r.title) + '</div>' +
        '<div class="sub">' + esc(r.cat) + ' · ' + esc(fmtDate(r.date)) + '</div>' +
      '</div>' +
      '<div class="admin-btns">' +
        '<button class="btn btn-ghost btn-small" onclick="openReview(\'' + esc(r.id) + '\')">Ver</button>' +
        '<button class="btn btn-ghost btn-small" onclick="editReview(\'' + esc(r.id) + '\')">Editar</button>' +
        '<button class="btn btn-danger" onclick="deleteReview(\'' + esc(r.id) + '\')">Eliminar</button>' +
      '</div>' +
    '</div>';
  }).join("");
}

function renderAll() {
  renderGrid();
  renderAdmin();
}

// ============================================
//  INIT
// ============================================
loadDrafts();
renderGrid();
route();
loadData();
</script>
